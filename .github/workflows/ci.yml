name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    unit:
        name: Lint, typecheck, unit tests, build
        runs-on: ubuntu-latest
        # Without an explicit limit these jobs inherit GitHub's 6-hour default,
        # so a stalled network call (apt mirrors, a browser download) burns a
        # runner for hours and leaves the check pending instead of failing.
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            - run: bun run lint
            - run: bun run typecheck
            - run: bun run test
            - run: bun run build
              env:
                  DATABASE_URL: postgresql://stackboard:stackboard@localhost:5432/stackboard
                  SESSION_SECRET: ci-only-secret

    integration:
        name: Integration tests (Postgres)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: stackboard
                    POSTGRES_PASSWORD: stackboard
                    POSTGRES_DB: stackboard_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U stackboard"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            # The suite recreates the schema itself and refuses to run unless
            # DATABASE_URL contains "stackboard_test".
            - run: bun run test:integration

    e2e:
        name: End-to-end tests (Playwright)
        runs-on: ubuntu-latest
        timeout-minutes: 25
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: stackboard
                    POSTGRES_PASSWORD: stackboard
                    POSTGRES_DB: stackboard
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U stackboard"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            # `--with-deps` shells out to apt-get, which has stalled on the
            # runner's mirrors before with no timeout of its own. Capped here so
            # the failure is a red X in 10 minutes, not a pending check.
            - run: bunx playwright install --with-deps chromium
              timeout-minutes: 10
            - run: bun run db:migrate
              env:
                  DATABASE_URL: postgresql://stackboard:stackboard@localhost:5432/stackboard
            - run: bun run test:e2e
              env:
                  DATABASE_URL: postgresql://stackboard:stackboard@localhost:5432/stackboard
                  SESSION_SECRET: ci-only-secret
                  # Playwright's webServer boots the app on 3100
                  # (playwright.config.ts), not the dev default 3000.
                  APP_URL: http://localhost:3100
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
