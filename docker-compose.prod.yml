# Production-shaped compose: builds the web + worker services from
# ./Dockerfile plus Postgres and MinIO, all on one network.
#
# Two uses:
#   1. Local end-to-end verification before touching any server:
#        docker compose -f docker-compose.prod.yml up --build
#   2. A starting point for any Docker-Compose-based host or PaaS (Coolify,
#      Dokploy, a plain VM, …). The env defaults below match .env.example for
#      (1) — for an actual deploy, override every var that needs a real value
#      (POSTGRES_PASSWORD, SESSION_SECRET, APP_URL, RESEND_API_KEY,
#      MINIO_ROOT_PASSWORD) in your platform's env panel or an env file kept
#      out of git, rather than editing this file with real secrets.
#
# Object storage is MinIO (self-hosted alongside the app), not local disk —
# see lib/storage/index.ts. S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY must match
# MINIO_ROOT_USER/MINIO_ROOT_PASSWORD below since this MinIO instance has no
# separate app-scoped credentials configured.
#
# Migrations run automatically on boot as part of `web`'s own CMD (see
# Dockerfile) — deliberately not a platform pre-deploy hook, which can be
# unreliable at targeting the freshly-built image on a Docker Compose deploy
# and once left the database unmigrated while the container still served
# (and failed) requests.
#
# `web` publishes to loopback only (127.0.0.1). That keeps `up --build` on a
# laptop reachable at http://localhost:3000 while making sure a deploy never
# serves the app straight to the internet without TLS — a reverse proxy
# (Traefik, nginx, Caddy) is what should face the public and terminate it.
# A PaaS that proxies over the Docker network ignores this mapping entirely.
# Set WEB_BIND=0.0.0.0 only if you know you want the app exposed unproxied.

services:
    db:
        image: postgres:16-alpine
        restart: unless-stopped
        # ⚠️ Changing POSTGRES_PASSWORD here does NOT change the running
        # database's actual password once the volume below already has data —
        # the postgres image only applies this var on first init of an empty
        # data directory. Rotating it later means also running, once, against
        # the live db container: `ALTER USER stackboard WITH PASSWORD
        # '<new value>';`. Skipping that step leaves `web`/`worker` unable to
        # authenticate (they read the new value; Postgres still has the old
        # one), and the container never gets far enough to serve anything —
        # learned the hard way on the first production rotation.
        environment:
            POSTGRES_USER: stackboard
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
            POSTGRES_DB: stackboard
        volumes:
            - stackboard_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U stackboard']
            interval: 5s
            timeout: 5s
            retries: 10

    minio:
        image: minio/minio:latest
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-stackboard}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me}
        volumes:
            - stackboard_minio:/data
        healthcheck:
            test:
                ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
            interval: 5s
            timeout: 5s
            retries: 5

    web:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
            minio:
                condition: service_healthy
        environment:
            DATABASE_URL: postgresql://stackboard:${POSTGRES_PASSWORD:-change_me}@db:5432/stackboard
            SESSION_SECRET: ${SESSION_SECRET:-change_me_to_a_random_32_byte_secret}
            APP_URL: ${APP_URL:-http://localhost:3000}
            RESEND_API_KEY: ${RESEND_API_KEY:-}
            EMAIL_FROM: ${EMAIL_FROM:-Stackboard <onboarding@resend.dev>}
            S3_ENDPOINT: http://minio:9000
            S3_BUCKET: ${S3_BUCKET:-stackboard}
            S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-stackboard}
            S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change_me}
            S3_REGION: us-east-1
        ports:
            - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000'
        # No curl/wget on the alpine base — a plain Node request is what's
        # actually available. Hits /api/health so the container is only
        # reported ready once it can really reach the database, not merely
        # once the process has started; the endpoint answers 503 when it
        # can't.
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    worker:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        environment:
            DATABASE_URL: postgresql://stackboard:${POSTGRES_PASSWORD:-change_me}@db:5432/stackboard
            APP_URL: ${APP_URL:-http://localhost:3000}
            RESEND_API_KEY: ${RESEND_API_KEY:-}
            EMAIL_FROM: ${EMAIL_FROM:-Stackboard <onboarding@resend.dev>}
        # Overrides the image's default CMD (migrate-then-serve) to run the
        # jobs worker instead, from the full source tree copied to /worker in
        # the runner stage (see Dockerfile) — due-date reminders and
        # notification emails never fire without this service running. The
        # image's CMD still gets appended as trailing args to this entrypoint
        # (Compose only drops it when `command:` is set, and some PaaS compose
        # validators reject `command: []`/`command: null` here) — this is
        # harmless: db/jobs-worker.ts's main() never reads process.argv.
        entrypoint: ['node', 'node_modules/.bin/tsx', 'db/jobs-worker.ts']
        working_dir: /worker

volumes:
    stackboard_pgdata:
    stackboard_minio:
