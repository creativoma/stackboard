services:
    db:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: stackboard
            POSTGRES_PASSWORD: stackboard
            POSTGRES_DB: stackboard
        ports:
            - '5432:5432'
        volumes:
            - stackboard_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U stackboard']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    stackboard_pgdata:
